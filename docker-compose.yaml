# Used by Dokploy (Create Service > Compose). For local use see docker-compose.local.yml.
name: manga-portfolio

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: manga-portfolio:latest
    restart: unless-stopped
    expose:
      - "8080" # No published ports: Dokploy's Traefik routes to this via the Domains tab
    read_only: true # Immutable container filesystem
    tmpfs:
      - /tmp # nginx-unprivileged writes pid/temp files here
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true # Created by Dokploy; lets Traefik reach the service
